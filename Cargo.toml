[package]
name = "gostpadi"
version = "2.0.0"
edition = "2021"
description = "ГОСТ 19.701 блок-схемы из C/.gvn — Rust движок, wasm-ready"
repository = "https://github.com/sehaxe/gostpadi"
license = "MIT"

[lib]
name = "gostpadi"
path = "src/lib.rs"
# cdylib — только ради wasm-моста (src/wasm.rs); нативно используется rlib
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gostpadi"
path = "src/main.rs"

[features]
default = ["autofix"]
# мягкая нормализация форматирования C: табы, CRLF, BOM, пробелы в директивах.
# --no-default-features => строгий разбор (то же, что --no-fix на запуск).
autofix = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
lang-c = "0.15.1"
